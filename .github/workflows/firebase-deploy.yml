name: Firebase deploy (rules, indexes, storage)

# Deploys firestore.rules, firestore.indexes.json and storage.rules — the part of a release Vercel
# doesn't do. Runs on main when those files change, or by hand / API (workflow_dispatch).
#
# One-time setup by the owner: repository secret FIREBASE_SERVICE_ACCOUNT_BASE64 (the same value as
# on Vercel). Without it this job only prints a warning and does nothing.
#
# Safety: it first waits until this commit is live on Vercel and the server can write XP
# (/api/health), because the rules forbid the client from writing XP / publicXp itself.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [firestore.rules, firestore.indexes.json, storage.rules]

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Secret set?
        id: sa
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$SA" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_BASE64 secret is not set — nothing deployed."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for this commit on Vercel with server writes on
        if: steps.sa.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            out=$(curl -fsS --max-time 20 https://gavana-boxing.vercel.app/api/health || true)
            echo "try $i: $out"
            if echo "$out" | grep -q "\"version\":\"${GITHUB_SHA}\"" && echo "$out" | grep -q '"serverWrites":true'; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Production isn't on ${GITHUB_SHA} with server writes on (FIREBASE_SERVICE_ACCOUNT_BASE64 on Vercel?) — rules not deployed."
          exit 1

      - uses: actions/checkout@v4
        if: steps.sa.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.sa.outputs.present == 'true'
        with:
          node-version: 22

      - name: Deploy rules, indexes, storage
        if: steps.sa.outputs.present == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          printf '%s' "$SA" | base64 -d > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13.35.1 deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project gavana-boxing-89a22 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
